.pin.mine{background:#9bddac}

#heroArt svg{width:100%;height:100%}

#speech{background:white;border:3px solid var(--ink);border-radius:15px;padding:9px;flex:1;min-width:0;position:relative;font-size:12px;line-height:1.5}

#log{padding:6px 10px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px 7px max(10px,env(safe-area-inset-bottom))}

const target=()=>ch().places.find(p=>p.id===s.selected);

const mine=p=>s.owned.includes(p.id);

const enemy=p=>p.power+(s.growth[p.id]||0);

const income=()=>1000+s.owned.length*700;

const expense=()=>1200+Math.ceil(s.troops/10)*120+s.friends.length*150;

const net=()=>income()-expense();

function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}

function note(t){s.history.unshift("第"+(s.day+1)+"日 "+t);s.history=s.history.slice(0,100);$("log").textContent=t;save()}

function render(){

$("cash").textContent=money(s.cash);

$("troops").textContent=money(s.troops);

$("food").textContent=s.food;

$("network").textContent=s.network;

$("trust").textContent=s.trust;

$("alert").textContent=s.alert;

$("ap").textContent=s.ap+"/3";

$("land").textContent=s.owned.length+"/"+ch().places.length;

$("stamina").textContent=s.stamina;

$("mental").textContent=s.mental;

$("staminaBar").style.width=clamp(s.stamina,0,100)+"%";

$("mentalBar").style.width=clamp(s.mental,0,100)+"%";

$("chapter").innerHTML=ch().title+"<br><small>第"+(s.day+1)+"日</small>";

$("mapLabel").textContent=ch().area;

$("mode").textContent=s.mode==="normal"?"通常":s.mode==="isolated"?"⚠ 開き直り":"☸ 弁天教";

$("heroArt").innerHTML=portrait(s.mode==="monk"?"monk":"dino");

$("heroName").textContent=s.mode==="monk"?"出家ザウルス":"弁天ザウルス";

$("quote").textContent=s.mode==="monk"?"「頭は丸めた。野望は丸めていない。」":

s.mode==="isolated"?"「もう失うものはない……。」":

"「弁天二丁目から天下統一だ！」";

const p=target();

$("target").innerHTML=p?

"<b>"+p.name+"</b>｜"+(mine(p)?"統治中":"敵戦力 "+enemy(p))+"｜"+CAST[p.person][0]:

"地図上の攻略地点をタップして選択";

document.querySelectorAll("[data-speed]").forEach(b=>b.classList.toggle("active",+b.dataset.speed===speed&&running));

$("pause").textContent=running?"■":"▶";

markers.forEach(x=>x.m.setIcon(iconFor(x.p)));

save();

}

function stop(){running=false;if(timer)clearInterval(timer);timer=null;render()}

function start(n=speed){

if(modal||s.gameOver)return;

speed=n;running=true;

if(timer)clearInterval(timer);

timer=setInterval(()=>{

for(let i=0;i<speed;i++){

if(modal||s.gameOver||!advance()){stop();return}

}

render();

},1400);

render();

}

function show(title,text,options=[],person="dino"){

stop();modal=true;

$("dialogTitle").textContent=title;

$("dialogText").textContent=text;

$("dialogArt").innerHTML=portrait(person);

$("choices").replaceChildren();

options.forEach(o=>{

const b=document.createElement("button");b.className="choice";

const a=document.createElement("b");a.textContent=o.label;

const sm=document.createElement("small");sm.textContent=o.note||"";

b.append(a,sm);

b.onclick=()=>{

modal=false;$("overlay").classList.remove("show");

if(o.fn)o.fn();

if(!modal)crisis();

render();

};

$("choices").appendChild(b);

});

$("overlay").classList.add("show");

}

const info=(a,b,p="dino")=>show(a,b,[{label:"わかった"}],p);

function iconFor(p){

return L.divIcon({className:"",html:`<div class="pin ${mine(p)?"mine":""} ${s.selected===p.id?"selected":""}">${mine(p)?"✓":"!"}</div>`,iconSize:[29,29],iconAnchor:[14,14]});

}

function draw(){

if(!map)return;

markers.forEach(x=>map.removeLayer(x.m));markers=[];

map.flyTo(ch().center,ch().zoom,{duration:1});

ch().places.forEach(p=>{

const m=L.marker([p.lat,p.lng],{icon:iconFor(p)}).addTo(map);

m.bindTooltip(p.name);

m.on("click",()=>{s.selected=p.id;render()});

markers.push({p,m});

});

}

function spend(a,st){

if(s.mode!=="normal"){info("行動できない","専用モードの行動を選んでください。");return false}

if(s.ap<a){info("行動力不足","翌日になると回復します。");return false}

if(s.stamina<st){info("スタミナ不足","休息が必要です。");return false}

s.ap-=a;s.stamina-=st;return true;

}

function crisis(){

if(s.mode!=="normal"||s.gameOver)return;

if(s.cash<=-100000||s.network<=0){

isolate(s.cash<=-100000?"財政破綻":"人脈崩壊");

}

}

function isolate(reason){

s.mode="isolated";s.mental=75;s.troops=0;s.network=0;s.friends=[];

show("開き直りか、出家か",reason+"。\n\nすべてを失った弁天ザウルス。\n\nこのまま開き直るか、頭を丸めて弁天教を興すか。",

[

{label:"🔥 開き直る",note:"孤独な日々。メンタルが減少する"},

{label:"☸ 出家する",note:"弁天教を広め、領土を獲得する",fn:monkStart}

],"dino");

}

function monkStart(){

s.mode="monk";s.virtue=0;s.religion=0;s.mental=90;

show("弁天教、開宗！",

"弁天ザウルスは頭を丸めた。\n\n住民『ハゲ坊主だ！』\n\n出家ザウルス『違う。これは悟りのフォルムだ。』\n\n弁天教の布教が始まる。",

[{label:"合掌する"}],"monk");

}

const INSULTS=[

["clock","『いまはなんじ？ あ、お前には予定がないか。』"],

["yamaya","『やまや！！ その計画、ひどすぎる！！』"],

["chief","『回覧板からお前の名前を消した。』"],

["scare","『案山子の私より頼りないな。』"],

["train","『俺は終電を逃したが、お前は人生を逃した。』"]

];

function isolatedEvent(){

const e=INSULTS[rand(0,INSULTS.length-1)];

const dmg=rand(10,19);

s.mental=clamp(s.mental-dmg,0,100);s.insults++;

if(s.mental===0){gambleOffer();return}

show("孤独な一日",CAST[e[0]][0]+" "+e[1]+"\n\nメンタル −"+dmg+"\n残り："+s.mental,

[{label:"耐える"},{label:"☸ 出家する",fn:monkStart}],e[0]);

}

function gambleOffer(){

show("最終手段、倍プッシュ",

"メンタルが0になった。\n\n最後の一発逆転。\n成功率は20%。\n成功すれば戦力1,500・現金300万円を獲得。\n失敗すれば本当のゲームオーバー。",

[{label:"🎰 倍プッシュ！",fn:gamble},{label:"☸ 出家する",fn:monkStart}],"dino");

}

function gamble(){

if(Math.random()<.20){

s.mode="normal";s.mental=100;s.cash=3000000;s.troops=1500;

s.food=500;s.network=100;s.trust=100;s.stamina=100;s.ap=3;s.debt=0;

s.friends=["scare","yamaya","clock"];s.revivals++;

show("倍プッシュ大成功！",

"奇跡の20%を引いた！\n\n現金300万円！\n戦力1,500！\n山形県統一を狙える超戦力！",

[{label:"天下統一へ"}],"dino");

}else{

s.gameOver=true;

show("GAME OVER","倍プッシュ失敗。\n弁天ザウルスの野望はここで終わった。",

[{label:"最初から",fn:()=>{s=fresh();draw();note("新たな野望が始まった。")}}],"dino");

}

}

function monkMenu(){

if(s.mode!=="monk"){info("まだ出家していない","開き直り状態から出家できます。");return}

show("☸ 弁天教・宗務所",

"信者："+s.religion+"人\n徳："+s.virtue+"\nメンタル："+s.mental+

"\n\n弁天教が全国へ広まれば、戦わずして天下統一も夢ではない。",

[

{label:"座禅",note:"行動1／徳＋5／メンタル＋10",fn:()=>{

if(s.ap<1){info("行動力不足","明日まで待とう。");return}

s.ap--;s.virtue+=5;s.mental=clamp(s.mental+10,0,100);note("座禅で徳を積んだ。");

}},

{label:"街頭説法",note:"行動1／信者＋10〜30",fn:()=>{

if(s.ap<1){info("行動力不足","明日まで待とう。");return}

s.ap--;let n=rand(10,30);s.religion+=n;note("信者が"+n+"人増えた。");

}},

{label:"托鉢",note:"行動1／現金＋8,000",fn:()=>{

if(s.ap<1){info("行動力不足","明日まで待とう。");return}

s.ap--;s.cash+=8000;note("托鉢で8,000円を得た。");

}},

{label:"📣 大布教チャンス",note:"信者100・徳20以上／成功率30%",fn:mission},

{label:"閉じる"}

],"monk");

}

function mission(){

if(s.religion<100||s.virtue<20){

info("信仰不足","大布教には信者100人・徳20以上が必要。");

return;

}

s.religion-=100;s.virtue-=20;

if(Math.random()<.30){

if(s.chapter<2){

s.chapter=2;s.owned=[ch().home];

s.selected=null;

draw();

}

s.owned=ch().places.map(p=>p.id);

s.cash+=500000;s.mental=100;

show("速報！ 山形県が弁天教に！",

"ニュース『山形県内で弁天教が爆発的に流行！』\n\n住民『ハゲ坊主さまー！』\n\n出家ザウルス『ハゲではない。教祖だ。』\n\n山形県35市町村が一斉に帰依！",

[{label:"次の時代へ",fn:()=>{

s.mode="normal";s.troops=300;s.network=80;s.food=200;

s.chapter=3;s.owned=[ch().home];s.selected=null;draw();

note("東北制覇編が開幕！");

}}],"monk");

}else{

show("大布教、失敗！",

"住民『弁天教って何？』\n\n教祖『まだ早かったか……。』\n\n信者100人と徳20を消費した。",

[{label:"布教を続ける"}],"monk");

}

}

function advance(){

s.day++;s.ap=3;s.stamina=clamp(s.stamina+12,0,100);

if(s.mode==="isolated"){

s.cash-=1500;

if(s.day%2===0){isolatedEvent();return false}

note("誰からも連絡がない。");return true;

}

if(s.mode==="monk"){

s.cash-=300;s.mental=clamp(s.mental+2,0,100);

if(s.day%5===0){

show("出家の日々",

"通行人『ハゲ坊主！』\n\n教祖『光っているのは頭ではない。徳だ。』\n\n徳＋3",

[{label:"合掌する",fn:()=>{s.virtue+=3}}],"monk");

return false;

}

return true;

}

s.cash+=net();

if(s.day%5===0)s.food-=1+Math.ceil(s.troops/20);

if(s.food<0){s.food=0;s.troops=Math.max(0,s.troops-3)}

if(s.day%4===0){

const es=ch().places.filter(p=>!mine(p));

if(es.length){const p=es[rand(0,es.length-1)];s.growth[p.id]=(s.growth[p.id]||0)+2}

}

if(s.troops===0&&s.day%3===0){

show("やまや！！襲来",

"やまや！！おじさん『兵士がゼロだと！？』\n\n軍勢が本拠地に迫る！",

[

{label:"傭兵を雇う",note:"現金−25,000／兵力＋15",fn:()=>{s.cash-=25000;s.troops+=15}},

{label:"降伏する",fn:()=>isolate("本拠地陥落")}

],"yamaya");

return false;

}

crisis();

return !modal;

}

function battleAnimation(p,style,callback){

$("battleTitle").textContent=style==="tank"?"戦車突撃！！":

style==="hypnosis"?"催眠術発動！":

style==="ambush"?"夜襲！！":"出陣！！";

$("fxLeft").innerHTML=portrait("dino");

$("fxRight").innerHTML=portrait(p.person);

$("battleSub").textContent="弁天ザウルス VS "+CAST[p.person][0];

$("battleFx").classList.add("show");

setTimeout(()=>{

$("battleFx").classList.remove("show");

callback();

},1000);

}

function war(){

if(s.mode!=="normal"){info("戦争できない","開き直り・出家中は専用行動を使おう。");return}

const p=target();

if(!p){info("攻略先を選択","地図をタップして敵を選んでください。");return}

if(mine(p)){info("統治済み","すでに領土です。");return}

show("⚔ "+p.name+" 攻略戦",

"敵将："+CAST[p.person][0]+"\n敵戦力："+enemy(p)+"\n自軍："+s.troops,

[

{label:"正面突破",note:"スタミナ−30",fn:()=>fight(p,"charge")},

{label:"🚜 戦車突撃",note:"30,000円／スタミナ−35",fn:()=>fight(p,"tank")},

{label:"🌀 催眠術",note:"12,000円／スタミナ−25",fn:()=>fight(p,"hypnosis")},

{label:"🌙 夜襲",note:"8,000円／スタミナ−20",fn:()=>fight(p,"ambush")},

{label:"撤退"}

],p.person);

}

function fight(p,style){

const cost={charge:0,tank:30000,hypnosis:12000,ambush:8000}[style];

const st={charge:30,tank:35,hypnosis:25,ambush:20}[style];

if(s.troops<=0){info("兵力ゼロ","先に徴兵してください。");return}

if(s.cash<cost){info("資金不足","作戦費用が足りません。");return}

if(!spend(1,st))return;

s.cash-=cost;

battleAnimation(p,style,()=>{

let chance=45+(s.troops-enemy(p))*1.1+s.friends.length*3;

if(style==="tank")chance+=40;

if(style==="hypnosis")chance+=22;

if(style==="ambush")chance+=15;

chance=clamp(chance,5,97);

const win=Math.random()*100<chance;

const loss=rand(3,win?9:18);

s.troops=Math.max(0,s.troops-loss);

s.alert=clamp(s.alert+(style==="tank"?20:5),0,100);

if(win){

s.owned.push(p.id);s.network=clamp(s.network+2,0,100);

s.cash+=rand(4000,12000);

note(p.name+"を制圧！");

if(s.owned.length===ch().places.length)complete();

else show("大勝利！",CAST[p.person][0]+"を撃破！\n\n戦力−"+loss,

[{label:"勝利のポーズ！"}],p.person);

}else{

note(p.name+"で敗北。");

show("敗北！","敵将「まだまだ甘いな！」\n\n戦力−"+loss,

[{label:"再挑戦する"}],p.person);

}

});

}

function complete(){

if(s.chapter===4){

s.won=true;

show("全国統一！","弁天二丁目から始まった野望が日本全国を制覇！",

[{label:"続ける"}],"dino");

return;

}

const next=s.chapter+1;

show("エリア制覇！",

ch().area+"を完全制圧！\n\n次は「"+CHAPTERS[next].area+"」へ進軍！",

[{label:"次の章へ",fn:()=>{

s.chapter=next;s.owned=[ch().home];s.selected=null;

s.troops+=40;s.cash+=100000;s.food+=50;s.ap=3;s.stamina=100;

draw();note(ch().area+"編が始まった！");

}}],"dino");

}

function work(){

if(s.mode==="monk"){monkMenu();return}

if(s.mode!=="normal"){info("仕事がない","誰も雇ってくれない。");return}

show("💰 アルバイト",

"現金："+money(s.cash)+"円\n行動力："+s.ap+"/3",

[

{label:"短時間バイト",note:"行動1／体力−15／＋6,000円",fn:()=>{

if(!spend(1,15))return;s.cash+=6000;note("バイト代6,000円。");

}},

{label:"長時間バイト",note:"行動2／体力−40／＋18,000円",fn:()=>{

if(!spend(2,40))return;s.cash+=18000;note("バイト代18,000円。");

}},

{label:"食料を買う",note:"行動1／−8,000円／食料＋20",fn:()=>{

if(!spend(1,5))return;s.cash-=8000;s.food+=20;

}},

{label:"借金する",note:"＋50,000円／借金＋55,000円",fn:()=>{

if(!spend(1,5))return;s.cash+=50000;s.debt+=55000;s.network--;

}},

{label:"閉じる"}

],"chief");

}

function people(){

if(s.mode==="monk"){monkMenu();return}

if(s.mode!=="normal"){info("孤立","誰も電話に出ない。");return}

show("🤝 人脈づくり",

"奇妙な仲間を増やそう。",

[

{label:"街で怪人を探す",note:"行動1／スタミナ−20",fn:()=>{

if(!spend(1,20))return;

const keys=Object.keys(CAST).filter(k=>!["dino","monk"].includes(k)&&!s.friends.includes(k));

const k=keys[rand(0,keys.length-1)]||"clock";

show("怪人が仲間になった！",CAST[k][0]+"が現れた！\n必殺技："+CAST[k][2],

[{label:"仲間にする",fn:()=>{if(!s.friends.includes(k))s.friends.push(k);s.network+=2}}],k);

}},

{label:"地域交流会",note:"行動1／人脈＋5／信用＋5",fn:()=>{

if(!spend(1,15))return;s.network+=5;s.trust=clamp(s.trust+5,0,100);

}},

{label:"閉じる"}

],"clock");

}

function manage(){

if(s.mode==="monk"){monkMenu();return}

if(s.mode!=="normal"){info("内政停止","誰も命令を聞かない。");return}

show("🏯 内政",

"日次収支："+money(net())+"円",

[

{label:"徴兵",note:"行動1／15,000円／兵力＋20",fn:()=>{

if(!spend(1,20))return;s.cash-=15000;s.troops+=20;

}},

{label:"休息",note:"行動1／スタミナ＋45",fn:()=>{

if(s.ap<1){info("行動力不足","翌日まで待とう。");return}

s.ap--;s.stamina=clamp(s.stamina+45,0,100);

}},

{label:"住民サービス",note:"行動1／12,000円／信用＋15",fn:()=>{

if(!spend(1,15))return;s.cash-=12000;s.trust=clamp(s.trust+15,0,100);

}},

{label:"強引な徴税",note:"行動1／現金＋30,000／信用−20",fn:()=>{

if(!spend(1,10))return;s.cash+=30000;s.trust=clamp(s.trust-20,0,100);

}},

{label:"閉じる"}

],"mayor");

}

function special(){

if(s.mode==="monk"){monkMenu();return}

if(s.mode==="isolated"){

show("開き直り",

"メンタル："+s.mental+"\n\n出家するか、孤独な日々を続けるか。",

[{label:"☸ 出家する",fn:monkStart},{label:"耐える"}],"dino");

return;

}

info("特殊行動","通常モードです。\n破産や人脈崩壊から別ルートが始まります。");

}

function menu(){

show("📖 戦記",

"第"+(s.day+1)+"日\n日次収支："+money(net())+"円\n借金："+money(s.debt)+"円\n\n"+

s.history.slice(0,8).join("\n"),

[

{label:"最初からやり直す",fn:()=>{

show("初期化確認","セーブデータを消去します。",

[{label:"消去する",fn:()=>{s=fresh();draw();note("新たな野望が始まった。")}},{label:"戻る"}]);

}},

{label:"閉じる"}

],"dino");

}

$("war").onclick=war;

$("work").onclick=work;

$("people").onclick=people;

$("manage").onclick=manage;

$("special").onclick=special;

$("menu").onclick=menu;

document.querySelectorAll("[data-speed]").forEach(b=>{

b.onclick=()=>{

const n=+b.dataset.speed;

if(running&&speed===n)stop();

else start(n);

};

});

$("pause").onclick=()=>running?stop():start(speed);

document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});

window.addEventListener("load",()=>{

if(typeof L!=="undefined"){

map=L.map("map").setView(ch().center,ch().zoom);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{

maxZoom:19,attribution:'&copy; OpenStreetMap contributors'

}).addTo(map);

draw();

}else{

$("mapLabel").textContent="地図の読み込みに失敗";

}

render();

if(!s.history.length)note("弁天二丁目の野望が始まった！");

});

</script>

</body>

</html>
